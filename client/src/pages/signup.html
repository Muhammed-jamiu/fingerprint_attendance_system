<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <form id="signupForm" class="bg-white p-8 rounded-lg shadow-md w-96">
      <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">
        Create Account
      </h1>

      <!-- Full Name -->
      <div class="mb-4">
        <label class="block mb-1">Full Name</label>
        <input
          type="text"
          id="fullName"
          class="w-full border p-3 rounded outline-none focus:ring-2 focus:ring-blue-600"
          placeholder="Enter full name"
          required
        />
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label class="block mb-1">Email</label>
        <input
          type="email"
          id="email"
          class="w-full border p-3 rounded outline-none focus:ring-2 focus:ring-blue-600"
          placeholder="Enter email"
          required
        />
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label class="block mb-1">Password</label>
        <input
          type="password"
          id="password"
          class="w-full border p-3 rounded outline-none focus:ring-2 focus:ring-blue-600"
          placeholder="Enter password"
          required
        />
      </div>

      <!-- Role -->
      <!-- <div class="mb-4">
        <label class="block mb-1">Role</label>
        <select id="role" class="w-full border p-3 rounded" required>
          <option value="">Select role</option>
          <option value="admin">Admin</option>
          <option value="student">Student</option>
        </select>
      </div> -->

      <!-- Error Message -->
      <p id="errorBox" class="text-red-500 text-sm mb-3 text-center"></p>

      <!-- Submit -->
      <button
        type="submit"
        class="bg-blue-600 text-white w-full p-3 rounded hover:bg-blue-700"
      >
        Sign Up
      </button>
      <p>
        <a href="./login.html" class="text-sm block mt-4 text-center"
          >Already have an account?
          <span class="font-bold hover:underline text-blue-600">Login</span></a
        >
      </p>
    </form>

    <script src="../js/signup.js"></script>
  </body>
</html>
