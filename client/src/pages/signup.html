<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
    <link rel="icon" type="image/jpeg" href="../../public/logo_2.jpg" />
    <link rel="stylesheet" href="../output.css" />
  <style>
  #logo {
    text-align: center;
    width: 100px;
    height: 100px;
    display: flex;
    background-image: url("../../public/logo_2.jpg");
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-top: 3px solid #ffffff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>
  </head>

  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <form id="signupForm" class="bg-white p-8 rounded-lg shadow-md w-96">
      <!-- School Logo Section-->
      <div class="flex justify-center mb-4">
        <div id="logo"></div>
      </div>
      <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">
        Create Account
      </h1>

      <!-- Full Name -->
      <div class="mb-4">
        <label class="block mb-1">Lecturer Name</label>
        <input
          type="text"
          id="fullName"
          class="w-full border border-gray-400 p-3 rounded outline-none focus:ring-2 focus:ring-blue-600"
          placeholder="Enter your full name"
          required
        />
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label class="block mb-1">Lecturer Email</label>
        <input
          type="email"
          id="email"
          class="w-full border p-3 rounded outline-none focus:ring-1 focus:ring-blue-600 border-gray-400"
          placeholder="Enter email"
          required
        />
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label class="block mb-1">Password</label>
        <input
          type="password"
          id="password"
          class="w-full border p-3 rounded outline-none focus:ring-2 focus:ring-blue-600 border-gray-400"
          placeholder="Create a new password "
          required
        />
      </div>
      <!-- course information section -->
      <p>Course Info.</p>
      <hr class="text-gray-400 font-bold" />
      <div>
        <!-- course tittle -->
        <div class="mb-4">
          <label class="block mb-1">Course Tittle</label>
          <input
            type="text"
            id="courseTitle"
            class="w-full border p-3 rounded outline-none focus:ring-2 focus:ring-blue-600 border-gray-400"
            placeholder="Enter course tittle "
            required
          />
        </div>
        <!-- course code -->
        <div class="mb-4">
          <label class="block mb-1">Course Code</label>
          <input
            type="text"
            id="courseCode"
            class="w-full border p-3 rounded outline-none focus:ring-2 focus:ring-blue-600 border-gray-400"
            placeholder="Enter course code"
            required
          />
        </div>
      </div>
      <!-- Error Message -->
      <p id="errorBox" class="text-red-500 text-sm mb-3 text-center"></p>

      <!-- Submit -->
     <button
  id="signupBtn"
  type="submit"
  class="bg-blue-600 text-white w-full p-3 rounded hover:bg-blue-700 hover:cursor-pointer flex items-center justify-center gap-2 transition disabled:bg-gray-400 disabled:cursor-not-allowed disabled:opacity-80"
>
  <span id="btnText">Sign Up</span>
</button>
      <p>
        <a href="./login.html" class="text-sm block mt-4 text-center"
          >Already have an account?
          <span class="font-bold hover:underline text-blue-600">Login</span></a
        >
      </p>
    </form>

    <div
      id="successModal"
      class="fixed inset-0 bg-green-500/50 hidden items-center justify-center z-50"
    >
      <div
        class="bg-white w-80 rounded-lg shadow-lg p-6 text-center animate-bounce"
      >
    <script src="../js/signup.js"></script>
  </body>
</html>
