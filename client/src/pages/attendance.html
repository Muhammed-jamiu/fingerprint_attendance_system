<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Attendance</title>
    <link rel="stylesheet" href="../output.css" />
    <link rel="icon" type="image/jpeg" href="../../public/logo_2.jpg" />
    <style>
      #logo {
        text-align: center;
        width: 100px;
        height: 100px;
        display: flex;
        background-image: url("../../public/logo_2.jpg");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }

      #message {
        height: 36px;
        position: relative;
      }

      .spinner {
        width: 18px;
        height: 18px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <form id="attendanceForm" class="bg-white p-8 rounded-2xl shadow w-96">
      <!-- School Logo Section-->
      <div class="flex justify-center mb-2">
        <div id="logo"></div>
      </div>
      <h1 class="text-2xl font-bold mb-2 text-center">Confirm Matric Number</h1>
      <div class="text-center mb-2">
        <div id="message" class="italic font-bold text-red-500"></div>
      </div>
      <div class="mt-4">
        <label for="matricno" class="font-bold">Matric Number</label>
        <input
          type="text"
          id="matricNo"
          placeholder="Enter your Matric number"
          class="w-full border p-3 mb-6 mt-2 font-bold italic rounded"
        />
      </div>

      <button
        id="attendanceBtn"
        class="bg-green-600 text-white w-full p-3 rounded hover:cursor-pointer flex items-center justify-center gap-2 disabled:bg-gray-400 disabled:cursor-not-allowed disabled:opacity-80"
      >
        <span id="btnText">Mark Attendance</span>
      </button>
    </form>

    <script src="../js/attendance.js"></script>
  </body>
</html>
