<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Attendance</title>
    <link rel="stylesheet" href="../output.css" />
  </head>

  <body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <form id="attendanceForm" class="bg-white p-8 rounded shadow w-96">
      <h1 class="text-2xl font-bold mb-6 text-center">Confirm Matric Number</h1>
      <div class="p-2 text-center mb-4">
        <div id="message" class="italic font-bold text-red-500"></div>
      </div>
      <div>
        <label for="matricno" class="font-bold">Matric Number</label>
        <input
          type="text"
          id="matricNo"
          placeholder="Enter your Matric number"
          class="w-full border p-3 mb-4 mt-2 font-bold italic rounded"
        />
      </div>

      <button
        class="bg-green-600 text-white w-full p-3 rounded hover:cursor-pointer"
      >
        Mark Attendance
      </button>
    </form>

    <script src="../js/attendance.js"></script>
  </body>
</html>
