<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register Student</title>
    <link rel="stylesheet" href="../output.css" />
    <link rel="icon" type="image/jpeg" href="../../public/logo_2.jpg" />
    <style>
      #logo {
        text-align: center;
        width: 100px;
        height: 100px;
        display: flex;
        background-image: url("../../public/logo_2.jpg");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }

      .spinner {
        width: 18px;
        height: 18px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 p-10">
    <form
      id="studentForm"
      class="bg-white p-8 rounded-2xl shadow max-w-lg mx-auto"
    >
      <!-- School Logo Section-->
      <div class="flex justify-center mb-4">
        <div id="logo"></div>
      </div>
      <h1 class="text-2xl text-center font-bold mb-4">Register Student</h1>
      <p class="text-red-500 text-center italic p-4 relative" id="message"></p>
      <div class="">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          placeholder="Enter full name"
          class="w-full border p-3 mb-4 rounded"
        />
      </div>

      <div class="">
        <label for="matricNumber">Matric Number</label>
        <input
          type="text"
          id="matricNumber"
          placeholder="Enter matric number e.g ( FPN2026CS0001)"
          class="w-full border p-3 mb-4 rounded placeholder:italic"
        />
      </div>
      <button
        id="regbtn"
        class="bg-blue-600 text-white w-full p-3 rounded mt-4 hover:bg-blue-700 transition duration-200 hover:cursor-pointer flex items-center justify-center gap-2 disabled:bg-gray-400 disabled:cursor-not-allowed disabled:opacity-80"
      >
        <span id="btnText">Register Student</span>
      </button>
    </form>

    <script src="../js/registerStudent.js"></script>
  </body>
</html>
