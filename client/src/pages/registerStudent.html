<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register Student</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 p-10">
    <form id="studentForm" class="bg-white p-8 rounded shadow max-w-lg mx-auto">
      <h1 class="text-2xl font-bold mb-6">Register Student</h1>

      <input
        type="text"
        id="fullName"
        placeholder="Full Name"
        class="w-full border p-3 mb-4 rounded"
      />

      <input
        type="text"
        id="matricNumber"
        placeholder="Matric Number"
        class="w-full border p-3 mb-4 rounded"
      />

      <input
        type="text"
        id="fingerprintId"
        placeholder="Fingerprint ID e.g FP001"
        class="w-full border p-3 mb-4 rounded"
      />

      <button class="bg-blue-600 text-white w-full p-3 rounded">
        Register Student
      </button>
    </form>

    <script src="../js/registerStudent.js"></script>
  </body>
</html>
