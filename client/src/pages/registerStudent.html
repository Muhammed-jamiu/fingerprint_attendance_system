<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register Student</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 p-10">
    <form id="studentForm" class="bg-white p-8 rounded shadow max-w-lg mx-auto">
      <h1 class="text-2xl font-bold mb-6">Register Student</h1>
      <div class="">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          placeholder="Enter full name"
          class="w-full border p-3 mb-4 rounded"
        />
      </div>

      <div class="">
        <label for="matricNumber">Matric Number</label>
        <input
          type="text"
          id="matricNumber"
          placeholder="Enter matric number"
          class="w-full border p-3 mb-4 rounded"
        />
      </div>

      <!-- <div class="">
        <label for="fingerprintId">Fingerprint ID</label>
        <input
          type="text"
          id="fingerprintId"
          placeholder="Enter fingerprint ID e.g FP001"
        class="w-full border p-3 mb-4 rounded"
      /> -->

      <button
        class="bg-blue-600 text-white w-full p-3 rounded mt-4 hover:bg-blue-700 transition duration-200"
      >
        Register Student
      </button>
    </form>

    <script src="../js/registerStudent.js"></script>
  </body>
</html>
