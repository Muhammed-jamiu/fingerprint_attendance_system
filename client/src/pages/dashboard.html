<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <div class="flex">
      <aside class="w-64 bg-blue-700 min-h-screen text-white p-5">
        <h1 class="text-2xl font-bold mb-10">Attendance System</h1>

        <ul class="space-y-4">
          <li>
            <a href="./register-student.html"> Register Student </a>
          </li>

          <li>
            <a href="./attendance.html"> Mark Attendance </a>
          </li>
        </ul>
      </aside>

      <main class="flex-1 p-10">
        <h2 class="text-3xl font-bold mb-6">Dashboard</h2>

        <div class="grid grid-cols-2 gap-5">
          <div class="bg-white p-6 rounded shadow">
            <h3>Total Students</h3>

            <p id="studentCount" class="text-4xl font-bold mt-4">0</p>
          </div>

          <div class="bg-white p-6 rounded shadow">
            <h3>Total Attendance</h3>

            <p id="attendanceCount" class="text-4xl font-bold mt-4">0</p>
          </div>
        </div>
      </main>
    </div>

    <script src="../js/dashboard.js"></script>
  </body>
</html>
