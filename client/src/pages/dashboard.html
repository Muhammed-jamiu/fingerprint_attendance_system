<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard</title>
    <link rel="stylesheet" href="../output.css" />
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
  </head>
  <body class="bg-gray-100 h-screen">
    <div class="flex">
      <aside
        class="w-66 bg-blue-700 h-screen md:flex lg:bg-green-500 lg:block text-white p-5"
      >
        <h1 class="text-2xl mb-10 font-bold">Attendance System</h1>

        <ul class="space-y-4 flex flex-col gap-4">
          <li
            class="bg-blue-500 hover:bg-blue-400 text-white font-bold py-2 px-4 rounded"
          >
            <a href="./registerStudent.html"> Register Student </a>
          </li>

          <li
            class="bg-blue-500 hover:bg-blue-400 text-white font-bold py-2 px-4 rounded"
          >
            <a href="./attendance.html"> Mark Attendance </a>
          </li>
        </ul>
        <button
          id="logoutBtn"
          class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded mt-80 w-full hover:cursor-pointer lg:text-green-500"
          onclick="logout()"
        >
          Logout
        </button>
      </aside>

      <main class="flex-1 p-10">
        <h2 class="text-3xl font-bold mb-6">Dashboard</h2>

        <div class="grid grid-cols-2 gap-5">
          <div class="bg-white p-6 rounded shadow">
            <h3>Total Students</h3>

            <p id="studentCount" class="text-4xl font-bold mt-4">0</p>
          </div>

          <div class="bg-white p-6 rounded shadow">
            <h3>Total Attendance</h3>

            <p id="attendanceCount" class="text-4xl font-bold mt-4">0</p>
          </div>
        </div>
      </main>
    </div>

    <script src="../js/dashboard.js"></script>
  </body>
</html>
