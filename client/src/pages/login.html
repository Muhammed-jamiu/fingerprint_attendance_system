<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="../output.css" />
    <link rel="icon" type="image/jpeg" href="../../public/logo_2.jpg" />
    <style>
      #logo {
        text-align: center;
        width: 100px;
        height: 100px;
        display: flex;
        background-image: url("../../public/logo_2.jpg");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }
      .spinner {
        width: 18px;
        height: 18px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <form id="loginForm" class="bg-white p-8 rounded-lg shadow-md w-96">
      <!-- School Logo Section-->
      <div class="flex justify-center mb-4">
        <div id="logo"></div>
      </div>
      <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">
        Login to Your Account
      </h1>
      <p id="errorBox" class="text-red-500 mt-4 text-center relative"></p>
      <div>
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          class="w-full border p-3 mb-4 rounded"
        />
      </div>

      <div>
        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          class="w-full border p-3 mb-4 rounded"
        />
      </div>

      <button
        id="loginBtn"
        class="bg-blue-600 text-white w-full p-3 rounded hover:bg-blue-700 transition duration-200 hover:cursor-pointer flex items-center justify-center gap-2 disabled:bg-gray-400 disabled:cursor-not-allowed disabled:opacity-80"
        type="submit"
      >
        <span id="btnText">Login</span>
      </button>
      <p class="text-center text-sm text-gray-600 mt-4">
        Don't have an account?
        <a
          href="./signup.html"
          class="text-blue-600 hover:underline text-sm font-bold"
        >
          Sign up
        </a>
      </p>
    </form>

    <script src="../js/login.js"></script>
  </body>
</html>
