<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Fingerprint Capture</title>

    <link rel="icon" type="image/jpeg" href="../../public/logo_2.jpg" />
    <link rel="stylesheet" href="../output.css" />
    <style>
      @keyframes scan {
        0% {
          top: 0;
        }

        100% {
          top: 100%;
        }
      }

      .scan-animation {
        animation: scan 2s linear infinite;
      }
    </style>
  </head>

  <body class="bg-gray-100 h-[80%] flex items-center justify-center">
    <div
      class="bg-white p-10 rounded-2xl shadow-xl w-125 flex flex-col justify-center"
    >
      <h1 class="text-3xl font-bold mb-4 text-center">Fingerprint Capture</h1>

      <!-- THUMB SELECT -->

      <div class="flex justify-center gap-10 mb-4">
        <label class="flex items-center gap-2">
          <input type="radio" name="thumb" value="left" checked />

          Left Thumb
        </label>

        <label class="flex items-center gap-2">
          <input type="radio" name="thumb" value="right" />

          Right Thumb
        </label>
      </div>

      <!-- FINGERPRINT DISPLAY -->
      <div
        class="relative w-72 h-72 border-4 border-dashed border-gray-400 rounded-2xl mx-auto overflow-hidden bg-gray-50 flex items-center justify-center"
      >
        <!-- FINGER IMAGE -->

        <img id="fingerprintImage" class="hidden w-42 z-10" />

        <!-- PLACEHOLDER -->

        <p id="placeholder" class="text-gray-400 text-center">
          Fingerprint Preview
        </p>

        <!-- SCAN LINE -->

        <div
          id="scanLine"
          class="hidden absolute top-0 left-0 w-full h-1 bg-green-500 animate-bounce"
        ></div>
      </div>

      <!-- BUTTONS -->

      <div class="flex gap-4 mt-8">
        <button
          id="captureBtn"
          class="bg-blue-600 text-white flex-1 p-4 rounded-xl hover:cursor-pointer"
        >
          Capture Fingerprint
        </button>

        <button
          id="saveBtn"
          class="bg-green-600 text-white flex-1 p-4 rounded-xl hover:cursor-pointer flex items-center justify-center gap-2 disabled:bg-gray-400 disabled:cursor-not-allowed disabled:opacity-80"
        >
          <span id="saveBtnText">Save Fingerprint</span>
        </button>
      </div>
    </div>

    <script type="text/javascript" src="../js/fingerprint.js"></script>
  </body>
</html>
